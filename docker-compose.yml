services:
  postgres:
    image: postgres:16
    container_name: paygate-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Harsh@3417
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: paygate-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: ./payment-service
    container_name: paygate-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USER: postgres
      DB_PASSWORD: Harsh@3417
      DB_POOL_SIZE: "35"
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_POLL_INTERVAL_MS: "200"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # No host port published on purpose: only the gateway should be reachable
    # from outside Docker. Temporarily uncomment the next two lines if you
    # need to curl payment-service directly while debugging:
    # ports:
    #   - "8081:8081"

  processor-service:
    build: ./processor-service
    container_name: paygate-processor-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSOR_MIN_LATENCY_MS: "50"
      PROCESSOR_MAX_LATENCY_MS: "500"
      PROCESSOR_FAILURE_RATE: "0.1"
    # No host port published on purpose: internal Kafka consumer/producer service

  postgres-auth:
    image: postgres:16
    container_name: paygate-postgres-auth
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Harsh@3417
    ports:
      - "5433:5432"   # 5433 on the host so it never collides with the payments Postgres on 5432
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: paygate-auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/auth
      DB_USER: postgres
      DB_PASSWORD: Harsh@3417
      JWT_SECRET: ${JWT_SECRET}
    # No host port published, same reasoning as payment-service: only the
    # gateway should be reachable from outside Docker. Uncomment to debug:
    # ports:
    #   - "8082:8082"

  redis:
    image: redis:7-alpine
    container_name: paygate-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ./gateway
    container_name: paygate-gateway
    depends_on:
      auth-service:
        condition: service_started
      payment-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8081
      RATE_LIMIT_PER_SECOND: "20"
      RATE_LIMIT_BURST: "40"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"

volumes:
  pgdata:
  pgdata-auth:
