server:
  port: 8082

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth?reWriteBatchedInserts=true}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Harsh@3417}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true

auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-min!}
    ttl-seconds: ${JWT_TTL_SECONDS:900}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true