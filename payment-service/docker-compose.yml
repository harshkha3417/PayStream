services:
  postgres:
    image: postgres:16
    container_name: paygate-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Harsh@3417
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build: .
    container_name: paygate-payment-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USER: postgres
      DB_PASSWORD: Harsh@3417
      DB_POOL_SIZE: "20"
    ports:
      - "8081:8081"

volumes:
  pgdata: