server:
  port: 8081

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: ${ENABLE_VIRTUAL_THREADS:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/payments?reWriteBatchedInserts=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Harsh@3417}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:60}
      minimum-idle: 20
      connection-timeout: 10000
      leak-detection-threshold: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:4}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:200}
  batch-size: ${OUTBOX_BATCH_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.zaxxer.hikari.pool.HikariPool: DEBUG